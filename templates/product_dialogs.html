{% macro product_dialogs(products) %}
{% for product in products %}
<dialog class="detail-dialog" id="product-dialog-{{ product.id }}" aria-labelledby="product-dialog-title-{{ product.id }}">
  <div class="detail-dialog-body">
    <div class="detail-dialog-media product-dialog-media"><img src="{{ product_image_url(product.image) }}" alt="{{ localized(product, 'name') }}" loading="lazy" width="800" height="1000"></div>
    <div class="detail-dialog-copy">
      <h2 id="product-dialog-title-{{ product.id }}">{{ localized(product, 'name') }}</h2>
      <strong class="price">{{ product.price_cents|money }}</strong>
      <p>{{ localized(product, 'description') }}</p>
      {% if product.stock > 0 %}
      <form class="add-to-cart" method="post" action="{{ url_for('cart_add') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="product_id" value="{{ product.id }}">
        <label class="sr-only" for="dialog-quantity-{{ product.id }}">{{ t('quantity') }}</label>
        <input id="dialog-quantity-{{ product.id }}" name="quantity" type="number" value="1" min="1" max="{{ [product.stock, 20]|min }}" inputmode="numeric">
        <button class="button button-small" type="submit"><i class="fa-solid fa-bag-shopping" aria-hidden="true"></i> {{ t('add_to_cart') }}</button>
      </form>
      {% else %}
      <p class="stock-note">{{ t('sold_out') }}</p>
      {% endif %}
    </div>
    <button class="video-arrow dialog-close" type="button" data-close-dialog autofocus aria-label="{{ t('video_close') }}"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
  </div>
</dialog>
{% endfor %}
{% endmacro %}
