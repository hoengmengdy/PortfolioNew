<section class="video-section section" aria-labelledby="videos-heading" data-video-carousel>
  <div class="section-heading">
    <div><h2 id="videos-heading">{{ t('videos_heading') }}</h2></div>
    <div class="video-nav">
      <button class="video-arrow" type="button" data-video-prev aria-label="{{ t('video_prev') }}"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
      <button class="video-arrow" type="button" data-video-next aria-label="{{ t('video_next') }}"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
    </div>
  </div>
  <div class="video-track">
    {% for n in range(1, 6) %}
    <article class="video-card">
      <a class="video-open" href="{{ url_for('video', name='koc-' ~ n ~ '.mp4') }}" aria-label="{{ t('video_play') }} {{ n }}">
        <img src="{{ url_for('static', filename='images/videos/koc-' ~ n ~ '.webp') }}" alt="" loading="lazy" width="480" height="853" draggable="false">
        <span class="video-play-icon"><i class="fa-solid fa-play" aria-hidden="true"></i></span>
      </a>
    </article>
    {% endfor %}
  </div>
  <dialog class="video-dialog" aria-labelledby="videos-heading">
    <div class="video-stage">
      <video controls playsinline preload="none" width="720" height="1280"></video>
      <button class="video-arrow video-close" type="button" data-video-close aria-label="{{ t('video_close') }}"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      <button class="video-arrow video-stage-prev" type="button" data-video-prev aria-label="{{ t('video_prev') }}"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
      <button class="video-arrow video-stage-next" type="button" data-video-next aria-label="{{ t('video_next') }}"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
    </div>
    <a class="button button-small" href="{{ url_for('shop') }}">{{ t('shop_now') }} <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
  </dialog>
</section>
