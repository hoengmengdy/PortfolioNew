<form class="retailer-edit-form" method="post" action="{{ url_for('save_retailer') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if store %}<input type="hidden" name="id" value="{{ store.id }}">{% endif %}<div class="form-grid">{% for field in ['name','country','city','address','phone','email'] %}<div class="field"><label for="store-{{ store.id if store else 'new' }}-{{ field }}">{{ t(field) }}{% if field in ['name','country','city','address'] %} *{% endif %}</label><input id="store-{{ store.id if store else 'new' }}-{{ field }}" name="{{ field }}" value="{{ store[field] if store else '' }}" type="{{ 'email' if field == 'email' else ('tel' if field == 'phone' else 'text') }}" maxlength="{{ 30 if field == 'phone' else (254 if field == 'email' else 200) }}" {% if field in ['name','country','city','address'] %}required{% endif %}></div>{% endfor %}</div><button class="button button-small" type="submit"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> {{ t('save_retailer') }}</button></form>
