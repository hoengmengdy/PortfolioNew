{% macro ingredient_cards(slugs) %}
<div class="ingredient-grid">
  {% for slug in slugs %}
  <article class="ingredient-card">
    <div class="ingredient-image"><img src="{{ url_for('static', filename='images/herbs/' + slug.replace('_', '-') + '.svg') }}" alt="{{ t('herb_' + slug + '_name') }}" loading="lazy" width="400" height="300"></div>
    <div class="ingredient-body">
      <h3>{{ t('herb_' + slug + '_name') }}</h3>
      <p>{{ t('herb_' + slug + '_description') }}</p>
      <h4>{{ t('benefits') }}</h4>
      <ul class="benefit-list">{% for benefit in t('herb_' + slug + '_benefits').split('|') %}<li><i class="fa-solid fa-leaf" aria-hidden="true"></i>{{ benefit }}</li>{% endfor %}</ul>
    </div>
  </article>
  {% endfor %}
</div>
{% endmacro %}
